name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: engage_test
          POSTGRES_USER: engage
          POSTGRES_PASSWORD: engage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engage -d engage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://engage:engage_test@localhost:5432/engage_test
      REDIS_URL: redis://localhost:6379/0
      APP_SECRET_KEY: ci-only-secret-not-for-production-1234567890
      N8N_WEBHOOK_SECRET: ci-only-automation-secret-1234567890
      CORS_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API dependencies
        run: pip install -e '.[dev]'
      - name: Critical static checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run API tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install
      - name: Build web
        run: npm run build

  release-gate:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Validate required release files
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f docs/FINAL_RELEASE_CHECKLIST_FA.md
          test -f docs/PRODUCTION_DEPLOYMENT_FA.md
          test -f scripts/production_smoke.py
          test -f ops/backup.sh
          test -f ops/restore.sh
